name: release

# Cria o .zip de distribuição + SHA256SUMS e anexa ao GitHub Release.
#
# Dois gatilhos:
#   - push de uma tag v*.*.*
#   - manual (Actions → release → Run workflow), informando a versão; a tag é
#     criada pelo próprio release, no commit em que o workflow rodou.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar, no formato v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versão
        env:
          VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          TAG="${VERSAO_MANUAL:-$GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $TAG (use v1.2.3)"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publicando $TAG"

      - name: Carimbar versão da tag em package.json e config.json
        # Sem isto o zip sai com a versão que estiver no repositório, e uma
        # instalação nova se acharia desatualizada e baixaria a mesma release.
        run: |
          V="${TAG#v}"
          node -e '
            const fs = require("fs"), v = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            const cfg = JSON.parse(fs.readFileSync("config.json", "utf8"));
            cfg._interno = { ...(cfg._interno ?? {}), versaoInstalada: v, ultimaVerificacao: null };
            fs.writeFileSync("config.json", JSON.stringify(cfg, null, 2) + "\n");
          ' "$V"
          grep -n '"version"' package.json; grep -n versaoInstalada config.json

      - name: Build Swift popup (injeta versão)
        run: bash mmpopup/build.sh

      - name: Build wrapper .app (injeta versão)
        run: bash instalador/fonte/build.sh

      - name: Zip (exclui git, logs, node_modules, .app pré-compilado)
        run: |
          ASSET="MM-Notify-${TAG}.zip"
          zip -r "$ASSET" . \
            -x '.git/*' \
            -x 'logs/*' \
            -x 'node_modules/*' \
            -x '.DS_Store' \
            -x 'testes/*' \
            -x 'extensao-chrome/node_modules/*' \
            -x 'instalador/MM-Notify.app/Contents/MacOS/.MM-Notify.SECONDARY' \
            -x 'mmpopup/MMPopup.app/Contents/MacOS/.MMPopup.SECONDARY'
          ls -lh "$ASSET"

      - name: SHA256SUMS
        run: shasum -a 256 MM-Notify-*.zip > SHA256SUMS
        working-directory: ${{ github.workspace }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            MM-Notify-${{ env.TAG }}.zip
            SHA256SUMS
